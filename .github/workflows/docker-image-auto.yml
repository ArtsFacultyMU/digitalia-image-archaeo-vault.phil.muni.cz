name: Automatic image build

on:
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ]
  workflow_dispatch:

inputs:
  TAG: git-action-test

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: cerit.io
          username: xadler
          password: ${{ secrets.HARBOR_KEY }}

      -
        uses: docker/build-push-action@v7
        name: Build and push
        with:
          tags: "cerit.io/xadler/archaeo-vault-drupal:$TAG"
          file: Dockerfile
          push: true
          sbom: true
          #build-args: BRANCH_CONF=test

